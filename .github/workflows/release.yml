name: Release

# This repo has no package.json/npm package -- nothing here is published to a registry. A pushed
# `v<semver>` tag is the entire release process: this workflow turns it into a GitHub Release, using
# the tag's own annotated message as the release notes (see CLAUDE.md's "Releasing" section for how
# that message gets written). Pushing the tag is what *initiates* this -- there is no local
# `gh release create` step, so don't run one by hand; that would just race this workflow.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release from the tag's own message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Read the tag's message via the GitHub API, not local git -- actions/checkout doesn't
          # reliably preserve the annotated tag object when materializing the ref locally (observed
          # directly: `git tag -l --format='%(contents)'` came back with the *commit* message
          # instead, even with fetch-depth: 0), so this is the only way to get it faithfully.
          OBJ_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq .object.type)"
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "Tag $TAG is lightweight (was it created with 'git tag -a'?) -- refusing to publish" >&2
            echo "a release with no real notes. Delete the tag, re-tag with -a -m, and push again." >&2
            exit 1
          fi
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" --jq .object.sha)"
          NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq .message)"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
